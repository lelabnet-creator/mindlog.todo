# DEV edge for mindlog.todo. Same /api reverse-proxy as nginx.prod.conf, but the
# SPA is NOT served from a built dist/ — instead everything is proxied to the Vite
# dev server (`webdev` service) so you get Hot Module Replacement. Mounted over
# /etc/nginx/conf.d/default.conf by docker-compose.override.yml (dev only).
#
# HTTP CLAIR SUR :80, comme nginx.prod.conf. L'edge unifié (edge/Caddyfile) est
# l'UNIQUE terminaison TLS : il retire le préfixe /app et proxifie vers
# http://127.0.0.1:8088 (= ce port 80). Un `return 301 https://…` ici renvoyait
# le visiteur de /app vers la racine, donc vers la vitrine — /app injoignable.
# Ne pas réintroduire d'écoute 443 : elle datait du vieux gateway/ (mort), qui
# joignait ce conteneur en https://web:443.

# Map the Upgrade header so WebSocket (Vite HMR) connections are proxied correctly.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Lazy Docker DNS resolution so nginx starts even if upstreams are briefly down.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $api_upstream http://api:8080;
  set $web_dev      http://webdev:5173;

  client_max_body_size 16m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # SSE change stream — disable buffering so events stream through immediately.
  location = /api/v1/events {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ { proxy_pass $api_upstream; }
  location = /health { proxy_pass $api_upstream; }
  location /docs { proxy_pass $api_upstream; }
  location = /openapi.json { proxy_pass $api_upstream; }

  # MCP Streamable HTTP — disable buffering so SSE responses stream through.
  location /mcp {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # OAuth 2.1 authorization server + discovery → API (the consent page /authorize
  # is a client-side route served by the Vite dev server below).
  location /oauth/ { proxy_pass $api_upstream; }
  location /.well-known/oauth-authorization-server { proxy_pass $api_upstream; }
  location /.well-known/oauth-protected-resource { proxy_pass $api_upstream; }
  location = /.well-known/openid-configuration { proxy_pass $api_upstream; }

  # Everything else → Vite dev server (HMR over WebSocket).
  #
  # Le `rewrite` remet le préfixe /app que l'edge vient de retirer. En prod le
  # bundle est bâti avec base=/app/ mais servi depuis la racine du docroot, donc
  # le strip de l'edge tombe juste ; en dev le serveur Vite sert RÉELLEMENT sous
  # /app/ (VITE_BASE), il faut donc le lui rendre. Vaut aussi pour le WebSocket
  # HMR (/app/vite-hmr, cf. VITE_HMR_PATH) : seul un chemin sous /app est routé
  # vers l'app par l'edge, la racine du domaine appartenant à la vitrine.
  location / {
    rewrite ^ /app$uri break;
    proxy_pass $web_dev;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
