# Production stack for str01. Runs PREBUILT images pulled from GHCR (built and
# pushed by .github/workflows/deploy.yml) — no build toolchain needed on the
# server. The web edge speaks plain HTTP behind str01's existing TLS reverse
# proxy. Used standalone (NOT layered on docker-compose.yml):
#   IMAGE_TAG=<tag> docker compose -f docker-compose.prod.yml up -d
#
# Required on the server: a `.env` file (see .env.prod.example) holding secrets.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mindlog}
    # No host port published — the db is only reachable inside the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindlog} -d ${POSTGRES_DB:-mindlog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # IMAGE_TAG est EXIGÉ, sans repli sur `latest` : le 2026-08-01 un `up -d`
    # lancé à la main sans ce tag a résolu `api:latest` sur l'image locale du
    # 26/06 — jamais re-pullée, car la CI ne tire que le tag qu'elle déploie —
    # et a rétrogradé la prod de six semaines en silence. Symptôme : la route
    # /api/v1/auth/mindlog-id n'existait pas dans ce build et tombait dans le
    # `requireAuth` fourre-tout d'accountRouter, donc 401 au lieu de 404.
    # Échouer bruyamment vaut mieux que servir une version arbitraire.
    image: ${REGISTRY:-ghcr.io/jacquesh82/mindlog.todo}/api:${IMAGE_TAG:?IMAGE_TAG must be set (ex. IMAGE_TAG=v1.7.1) — pas de repli sur latest}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mindlog}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mindlog}
      PORT: 8080
      APP_VERSION: ${IMAGE_TAG}
      APP_BUILD_DATE: ${APP_BUILD_DATE:-}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    # Le client web vit dans le dépôt `mindlog.todo.clients`, qui construit et
    # publie son image sous son propre paquet GHCR. Son tag est donc distinct de
    # celui de l'API : WEB_TAG d'un côté, IMAGE_TAG de l'autre.
    image: ${WEB_REGISTRY:-ghcr.io/jacquesh82/mindlog.todo.clients}/web:${WEB_TAG:-latest}
    # Serves the SPA over plain HTTP on a loopback port. TLS for todo.mindlog.today
    # is terminated by the Astro front (mindlog.landings/todo), which proxies the `/app`
    # sub-path here. Set WEB_HTTP_BIND=0.0.0.0 if the front is on another host.
    ports:
      - "${WEB_HTTP_BIND:-127.0.0.1}:${WEB_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
