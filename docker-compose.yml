# Module Todo — pile de developpement du depot applicatif, sur le poste.
#
# `name:` explicite, et il manquait (R7 de LeLab-infra) : le projet derive etait
# `mindlogtodo`, et `mindlogtodo_default` est reference en `external: true` par
# la passerelle. Le renommer sans precaution orphelinerait les volumes.
#
# ── La base a quitte cette pile le 2026-09-05 ─────────────────────────────
# Elle vit dans le PostgreSQL COMMUN du poste, rejoint par `lelab-dev`. C'est
# la suite logique de ce que l'override faisait deja a la main depuis des mois
# — viser `mindlog-pg` du repertoire dev-db — mais sans le detour : plus de
# service `db` mis sous profil pour l'empecher de demarrer, plus de reseau
# `dev-db_default` a joindre. Un override qui existe pour contredire son
# compose de base est un compose de base faux.
#
#   cd ../../../LeLab-infra && ./stacks/deploy.sh commun.infra.le-lab.net.app dev
name: ${TDO_PROJECT:-tdo-web-local}

services:
  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    # `default` repris explicitement : nommer ses reseaux fait qu'un service ne
    # rejoint plus que ceux-la, et l'API doit rester joignable par `web`.
    networks: [default, lelab-dev]
    env_file: .env
    environment:
      # Le locataire `mindlog_todo_local` du cluster commun : une base par
      # PILE, pour que celle-ci et `tdo-web-dev` ne se disputent pas les
      # memes donnees (R3, troisieme exception).
      DATABASE_URL: postgres://mindlog_todo:${PGPASS:?mot de passe du locataire requis - voir .env}@db:5432/mindlog_todo_local
      PORT: 8080
      # L'edge unifié sert le todo sous `/app` et retire ce préfixe : l'API, les
      # docs, /oauth et /.well-known sont donc tous exposés SOUS /app.
      PUBLIC_URL: https://todo.mindlog.today.localhost/app
      WEB_URL: https://todo.mindlog.today.localhost/app
      # Ces deux URLs portent un chemin : ce ne sont plus des origines valides,
      # donc la liste CORS par défaut qui en dérive doit être donnée en clair.
      CORS_ORIGINS: https://todo.mindlog.today.localhost,https://localhost,capacitor://localhost
      # "Sign in with mindlog id" — les appels serveur-à-serveur OIDC (discovery,
      # token, userinfo) vont sur https://idp.mindlog.today.localhost (edge + mkcert).
      # Trust the mkcert root CA mounted below so Node's fetch() accepts that cert.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/mindlog-rootCA.pem
    # Résout le domaine de l'IdP vers l'hôte, où la façade SNI écoute sur :443 et
    # passe le flux à Caddy. Le nom DOIT être celui du certificat mkcert
    # (*.mindlog.today.localhost) : tout autre SNI fait répondre à Caddy une
    # alerte TLS 80 « internal error » et le fetch() de l'api échoue en 500.
    extra_hosts:
      - "idp.mindlog.today.localhost:host-gateway"
    volumes:
      # Read-only mount of the mkcert root CA (created by scripts/gen-certs.sh).
      - ./certs/rootCA.pem:/etc/ssl/certs/mindlog-rootCA.pem:ro
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

  # The web container is the single entry point (edge): it terminates TLS, serves
  # the SPA and reverse-proxies /api, /mcp, /docs to the api service. Browse the
  # app at https://todo.mindlog.localhost (*.localhost resolves to loopback).
  # Generate the dev certificate first: `./scripts/gen-certs.sh`.
  web:
    build:
      # Le client web vit dans le dépôt frère `mindlog.todo.clients` : ce
      # contexte suppose les deux dépôts clonés côte à côte, comme dans le
      # monorepo. En prod l'image vient de GHCR (cf. docker-compose.prod.yml),
      # rien ne se construit depuis ici.
      context: ../mindlog.todo.clients/web
      dockerfile: Dockerfile
      args:
        # Empty => the SPA calls same-origin /api (proxied by this nginx).
        VITE_API_URL: ""
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

networks:
  # Cree par la pile commune de LeLab-infra, rejoint ici.
  lelab-dev:
    external: true
